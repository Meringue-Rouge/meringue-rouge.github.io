<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@MeringueRouge">
    <meta name="twitter:title" content="Meringue Rouge - Happy Holidays!">
    <meta name="twitter:description" content="RPG Developer Bakin assets, games, and more! Merry Christmas!">
    <meta property="og:title" content="Meringue Rouge - Happy Holidays!">
    <meta property="og:type" content="website">

    <title>Meringue Rouge - Merry Christmas!</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="meringue-theme">
    <div class="background-art"></div>
    
    <div class="snow-container">
        <div class="snow" style="--x-start: 10%; --y-start: 0%; --x-end: 15%; animation-duration: 12s; animation-delay: 0s;"></div>
        <div class="snow" style="--x-start: 50%; --y-start: -10%; --x-end: 45%; animation-duration: 10s; animation-delay: 2s;"></div>
        <div class="snow" style="--x-start: 80%; --y-start: -20%; --x-end: 85%; animation-duration: 15s; animation-delay: 4s;"></div>
        <div class="snow" style="--x-start: 30%; --y-start: 0%; --x-end: 35%; animation-duration: 9s; animation-delay: 6s;"></div>
        <div class="snow" style="--x-start: 65%; --y-start: -15%; --x-end: 60%; animation-duration: 13s; animation-delay: 8s;"></div>
        <div class="snow" style="--x-start: 5%; --y-start: -5%; --x-end: 10%; animation-duration: 7s; animation-delay: 10s;"></div>
        <div class="snow" style="--x-start: 95%; --y-start: -25%; --x-end: 90%; animation-duration: 11s; animation-delay: 12s;"></div>
        <div class="snow" style="--x-start: 40%; --y-start: -10%; --x-end: 42%; animation-duration: 14s; animation-delay: 14s;"></div>
        <div class="snow" style="--x-start: 70%; --y-start: 0%; --x-end: 75%; animation-duration: 8s; animation-delay: 16s;"></div>
        <div class="snow" style="--x-start: 20%; --y-start: -20%; --x-end: 25%; animation-duration: 16s; animation-delay: 18s;"></div>
    </div>
    
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-area">
                <img src="images/logo.png" alt="Meringue Rouge Logo" class="main-logo">
            </div>
            <img id="side-image" src="images/character.png" alt="Meringue Rouge Character">
            <div id="bio-text" class="bio"></div>
        </div>

        <div class="right-panel">
            <div class="header-top">
                <img src="images/logo.png" alt="Logo" class="mobile-logo">
                <div class="controls">
                    <div class="social-links">
                        <a href="https://www.youtube.com/@MeringueRouge" target="_blank" class="social-button"><i class="fab fa-youtube"></i></a>
                        <a href="https://x.com/MeringueRouge" target="_blank" class="social-button"><i class="fab fa-x-twitter"></i></a>
                        <a href="https://peing.net/ja/9d5a158dcb475f" target="_blank" class="social-button feedback-btn"><i class="fas fa-envelope"></i></a>
                    </div>
                    <button id="lang-switch" onclick="toggleLang()">日本語</button>
                </div>
            </div>

            <div class="nav-bar">
                <button class="tab-button active" onclick="switchTab('all')">All</button>
                <button class="tab-button" onclick="switchTab('assets')">Assets</button>
                <button class="tab-button" onclick="switchTab('games')">Games</button>
            </div>

            <div id="content" class="content-area"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
