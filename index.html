<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@MeringueRouge">
    <meta name="twitter:title" content="Meringue Rouge">
    <meta name="twitter:description" content="We've moved!">
    <meta property="og:title" content="Meringue Rouge">
    <meta property="og:type" content="website">

    <title>Meringue Rouge – We've Moved</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Extra styles just for the moved notice */
        body.meringue-theme {
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .moved-notice {
            text-align: center;
            max-width: 800px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.9);
            margin: 20px;
        }

        .moved-notice h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 700;
            color: #ff8fa3;
            margin: 0 0 20px 0;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .moved-notice p {
            font-size: 1.25rem;
            color: #4a4a4a;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .moved-notice a.button {
            display: inline-block;
            background: #ff8fa3;
            color: white;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(255, 143, 163, 0.35);
            transition: all 0.25s ease;
        }

        .moved-notice a.button:hover {
            background: #ff7a92;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 143, 163, 0.45);
        }

        .moved-notice .url {
            margin-top: 28px;
            font-size: 1.05rem;
            color: #888;
            word-break: break-all;
        }

        .moved-notice .url a {
            color: #ff8fa3;
            text-decoration: none;
            font-weight: 600;
        }

        .moved-notice .url a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="meringue-theme">
    <div class="background-art"></div>

    <div class="moved-notice">
        <h1>We moved!</h1>
        <p>This site is no longer updated here.<br>
           Please visit the new website:</p>
        
        <a class="button" href="https://meringue-rouge.neocities.org/">
            Go to the new site →
        </a>

        <div class="url">
            <a href="https://meringue-rouge.neocities.org/">https://meringue-rouge.neocities.org/</a>
        </div>
    </div>
</body>
</html>
