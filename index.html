<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@IngenoireP">
    <meta name="twitter:title" content="Meringue Rouge">
    <meta name="twitter:description" content="RPG Developer Bakin assets, games, and more!">
    <meta property="og:title" content="Meringue Rouge">
    <meta property="og:type" content="website">

    <title>Meringue Rouge</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="meringue-theme">
    <div class="background-art"></div>
    
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-area">
                <img src="images/logo.png" alt="Meringue Rouge Logo" class="main-logo">
            </div>
            <div class="character-wrapper">
                <img id="side-image" src="images/character.png" alt="Meringue Rouge Character">
            </div>
            <div id="bio-text" class="bio"></div>
        </div>

        <div class="right-panel">
            <div class="header-top">
                <img src="images/logo.png" alt="Logo" class="mobile-logo">
                
                <div class="controls">
                    <div class="social-links">
                        <a href="https://www.youtube.com/@MeringueRouge" target="_blank" class="social-button"><i class="fab fa-youtube"></i></a>
                        <a href="https://x.com/MeringueRouge" target="_blank" class="social-button"><i class="fab fa-x-twitter"></i></a>
                        <a href="https://peing.net/ja/9d5a158dcb475f" target="_blank" class="social-button feedback-btn"><i class="fas fa-envelope"></i></a>
                    </div>
                    <button id="lang-switch" onclick="toggleLang()">日本語</button>
                </div>
            </div>

            <div class="nav-bar">
                <button class="tab-button active" onclick="switchTab('all')">All</button>
                <button class="tab-button" onclick="switchTab('assets')">Assets</button>
                <button class="tab-button" onclick="switchTab('games')">Games</button>
            </div>

            <div id="content" class="content-area"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
