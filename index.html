<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@MeringueRouge">
    <meta name="twitter:title" content="Meringue Rouge">
    <meta name="twitter:description" content="RPG Developer Bakin assets, games, and more!">
    <meta property="og:title" content="Meringue Rouge">
    <meta property="og:type" content="website">

    <title>Meringue Rouge</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="meringue-theme">
    <div class="background-art"></div>
    
    <div class="main-container">
        <div class="left-panel">
            <div class="logo-area">
                <img src="images/logo.png" alt="Meringue Rouge Logo" class="main-logo">
            </div>
            <div class="character-wrapper">
                <img id="side-image" src="images/character.png" alt="Meringue Rouge Character">
            </div>
            <div id="bio-text" class="bio"></div>
        </div>

        <div class="right-panel">
            <div class="header-top">
                <img src="images/logo.png" alt="Logo" class="mobile-logo">
                
                <div class="nav-bar">
                    <button class="tab-button active" onclick="switchTab('all')">All</button>
                    <button class="tab-button" onclick="switchTab('assets')">Assets</button>
                    <button class="tab-button" onclick="switchTab('games')">Games</button>
                </div>
                <div class="controls">
                    <div class="social-links">
                        <a href="https://www.youtube.com/@MeringueRouge" target="_blank" class="social-button"><i class="fab fa-youtube"></i></a>
                        <a href="https://x.com/MeringueRouge" target="_blank" class="social-button"><i class="fab fa-x-twitter"></i></a>
                        <a href="https://github.com/Meringue-Rouge" target="_blank" class="social-button"><i class="fab fa-github"></i></a>
                        <a href="https://peing.net/ja/9d5a158dcb475f" target="_blank" class="social-button feedback-btn"><i class="fas fa-envelope"></i></a>
                        <a href="https://discord.gg/HEs9faqb2u" target="_blank" class="social-button feedback-btn"><i class="fab fa-discord"></i></a>
                    </div>
                    <button id="lang-switch" onclick="toggleLang()">日本語</button>
                </div>
            </div>


            <div id="content" class="content-area"></div>
        </div>
    </div>

    <script src="script.js"></script>
<!-- Code injected by live-server -->
<script>
	// <![CDATA[  <-- For SVG support
	if ('WebSocket' in window) {
		(function () {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					var parent = elem.parentElement || head;
					parent.removeChild(elem);
					var rel = elem.rel;
					if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
					}
					parent.appendChild(elem);
				}
			}
			var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
			var address = protocol + window.location.host + window.location.pathname + '/ws';
			var socket = new WebSocket(address);
			socket.onmessage = function (msg) {
				if (msg.data == 'reload') window.location.reload();

			};
			if (sessionStorage && !sessionStorage.getItem('IsThisFirstTime_Log_From_LiveServer')) {
				console.log('Live reload enabled.');
				sessionStorage.setItem('IsThisFirstTime_Log_From_LiveServer', true);
			}
		})();
	}
	else {
		console.error('Upgrade your browser. This Browser is NOT supported WebSocket for Live-Reloading.');
	}
	// ]]>
</script>
</body>
</html>
